<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Command</title>
<link rel="icon" id="favicon" href="/brand/favicon">
<link rel="apple-touch-icon" href="/brand/favicon">
<style>
:root{--bg:#0E1217;--bar:#11161C;--card:#141A21;--line:#232A33;--line2:#3A4450;--text:#E6E9EE;--muted:#A3ADBA;--amber:#FFC857;--red:#FF8A80;--blue:#7FB8FF;--chip:#1C232C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{color:#A9D0FF;text-decoration:underline}
button,input,select{font:inherit}select{max-width:100%;min-width:0;text-overflow:ellipsis}select.btn{white-space:normal;background:#0B0F13;padding-right:8px}input[type=text],input[type=password]{max-width:100%}
h1,h2,h3{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.muted{color:var(--muted)}.red{color:var(--red)}.amber{color:var(--amber)}.b{font-weight:600}.small{font-size:12px}.nowrap{white-space:nowrap}
header{border-bottom:1px solid var(--line);background:var(--bar);position:sticky;top:0;z-index:5}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 0}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em;color:var(--text);display:inline-flex;align-items:center;gap:10px}.brand:hover{text-decoration:none}.brand img{height:30px;width:auto;max-width:160px;border-radius:7px;display:block}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto}
nav a{padding:10px 12px;border-radius:8px;color:var(--muted)}nav a:hover{text-decoration:none;color:var(--text)}
nav a.on{background:var(--chip);color:var(--text);font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:8px 11px;cursor:pointer}
.seg button.on{background:var(--chip);color:var(--text);font-weight:600}
input[type=text],input[type=password],input[type=search]{background:#0B0F13;border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:9px 12px;min-width:0}
#search{width:210px}
#results{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line2);border-radius:10px;min-width:300px;max-width:90vw;box-shadow:0 12px 30px #0008;display:none;z-index:9}
#results a{display:block;padding:10px 14px;color:var(--text);border-bottom:1px solid var(--line)}#results a:last-child{border:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block}
.dot.off{background:#6B7684}
main{padding:24px 0 60px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;flex:1 1 300px;display:flex;flex-direction:column}
.card>.hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card>.bd{padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-width:0}
.card>.bd.flush{padding:0}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{font-size:38px;font-weight:650;line-height:1.1;letter-spacing:-.01em}
.hero small{font-size:17px;color:var(--muted);font-weight:500}
.verdict{font-size:32px;font-weight:650;line-height:1.15}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-child{border-top:0}
.kv>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.attack{background:var(--red);color:#2A0B08}.pill.anomaly{background:var(--amber);color:#1A1405}.pill.ok{background:#26303B;color:var(--muted)}.pill.info{background:#1E3550;color:#CFE4FF}
.btn{min-height:40px;padding:0 15px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.btn:hover{background:var(--chip);text-decoration:none;color:var(--text)}
.btn.pri{background:var(--amber);color:#1A1405;border-color:var(--amber);font-weight:600}.btn.pri:hover{background:#FFD67E}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.item{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.item:first-child{border-top:0}
.item .txt{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:5px}
.item .acts{flex:1 1 280px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.banbox{display:inline-flex;gap:6px;align-items:center}.banbox select{padding:0 8px;background:#0B0F13}
.facts{display:flex;flex-wrap:wrap;gap:8px 30px;margin:4px 0 0}.facts div{min-width:0;max-width:100%}.facts dt{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.facts dd{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.tw{overflow:auto;max-height:520px}
.hscroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}.legend i,.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.segbar{display:flex;gap:2px;height:14px}.segbar i{border-radius:4px;min-width:3px}
.flowband{fill-opacity:.38}.flowband:hover{fill-opacity:.8}.hit:hover{fill:#ffffff10}
table.matrix{width:auto;min-width:100%}table.matrix th[scope=row]{position:static;color:var(--text);font-weight:500}table.matrix td{border:2px solid var(--card);border-radius:6px;white-space:nowrap}
#tip{display:none;position:fixed;z-index:20;pointer-events:none;background:#0B0F13;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.45;color:var(--text);box-shadow:0 8px 24px #000a;max-width:320px;white-space:pre-wrap}#tip div:not(.b){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;color:var(--muted);padding:9px 12px;white-space:nowrap;z-index:1}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:#171E26}
.barcell{position:relative;min-width:70px}.barcell i{position:absolute;left:0;top:6px;bottom:6px;background:#26303B;border-radius:3px}.barcell span{position:relative;padding-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text);display:inline-flex;gap:8px;align-items:center}
.chip.on{background:#26303B;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:12px 36px}
.stats .hero{font-size:30px}
svg{display:block}
.map path{fill:#222B35;stroke:#0E1217;stroke-width:.6}
.map a:hover path{fill:#34404D}
.empty{color:var(--muted);padding:18px;font-size:13px}
#login{max-width:360px;margin:14vh auto;padding:0 20px;display:flex;flex-direction:column;gap:14px}
.note{border:1px dashed var(--line2);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:13px}
@media(max-width:700px){table.stack thead{display:none}table.stack tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 14px;border-top:1px solid var(--line)}table.stack tr:first-child{border-top:0}table.stack td{display:block;border:0;padding:0;min-width:0;text-align:left;max-width:100%}table.stack td:first-child{flex:1 1 100%}table.stack td.act{flex:1 1 100%}table.stack td.act:empty{display:none}table.stack td[data-l]:not([data-l=""]):not(:first-child)::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}table.stack .barcell{min-width:0;display:inline-block}table.stack .barcell i{display:none}table.stack .barcell span{padding:0}table.stack td.clip{max-width:100%;white-space:normal;overflow-wrap:anywhere}tr:hover td{background:transparent}.item .acts{justify-content:flex-start}.btn{min-height:44px}.btn.sm{min-height:38px}.hero{font-size:30px}.verdict{font-size:24px}#search{width:100%}.tools{width:100%}td.clip{max-width:180px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top">
<a class="brand" href="#/home"><img id="logo" src="/brand/logo" alt=""><span>Home Command</span></a>
<nav id="nav" aria-label="Sections"></nav>
<div class="tools">
<input id="search" type="search" placeholder="Search address, device, domain" aria-label="Search">
<div id="results"></div>
<div class="seg" id="range" role="group" aria-label="Time range"></div>
<span class="live" id="live"><span class="dot"></span><span id="livetxt">Live</span></span>
<button class="btn ghost sm" id="logout">Sign out</button>
</div>
</div></div></header>
<div class="wrap"><main id="main"></main></div>
<footer class="wrap muted small" style="padding:0 20px 28px">Home Command · country and network-owner data: <a href="https://db-ip.com" rel="noreferrer noopener" target="_blank">IP Geolocation by DB-IP</a></footer>
<script src="/static/app.js"></script>
</body>
</html>
